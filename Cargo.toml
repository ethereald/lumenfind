[package]
name = "lumenfind"
version = "0.1.0"
edition = "2024"
description = "Private, offline semantic photo search for Windows"
license = "MIT"

[dependencies]
anyhow = "1.0"
bytemuck = "1.24"
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
eframe = { version = "0.37", default-features = false, features = ["accesskit", "glow", "wayland", "x11"] }
global-hotkey = "0.8"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
ndarray = "0.17"
opener = "0.8"
ort = { version = "2.0.0-rc.14", features = ["download-binaries", "ndarray"] }
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rfd = "0.15"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.23"
thiserror = "2.0"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tray-icon = "0.26"
walkdir = "2.5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Imaging", "Win32_System_Com"] }
windows-service = "0.8"

[profile.release]
lto = "thin"
strip = true
